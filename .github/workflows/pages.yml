# A release tag is a deploy: npm run release tags vX.Y.Z, and its push publishes the tagged
# commit to GitHub Pages. A push to main deploys nothing (VER-9).
# Repository settings: Pages source "GitHub Actions"; the github-pages environment allows
# the tags v*.
name: Deploy to Pages

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
